name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make sure www/index.html exists
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            f=$(find . -name index.html -not -path './node_modules/*' -not -path './android/*' | head -1)
            echo "found: $f"
            [ -n "$f" ] && cp "$f" www/index.html
          fi
          ls -la www

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Copy web files
        run: npx cap sync android

      - name: Use the fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Bump versionCode
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
